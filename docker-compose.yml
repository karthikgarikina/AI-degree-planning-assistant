services:

  app:
    build: .
    container_name: degree_planner_app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
    command: ["python","main.py","--transcript","./data/sample_transcript.pdf","--goal","Plan my next two semesters to finish the AI minor"]

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:11434"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  ollama_data: