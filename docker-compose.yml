services:
  app:
    build: .
    container_name: degree_planner_app
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env
    entrypoint: ["python", "main.py"]
    command:
      [
        "--transcript",
        "./data/sample_transcript.pdf",
        "--goal",
        "Plan my next two semesters to finish the AI minor."
      ]

  frontend:
    build: .
    container_name: degree_planner_frontend
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8501:8501"
    entrypoint: ["streamlit", "run", "app.py"]
    command: ["--server.port=8501", "--server.address=0.0.0.0"]

  ollama:
    image: ollama/ollama
    container_name: degree_planner_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  ollama_data:
